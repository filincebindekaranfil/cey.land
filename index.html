<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cey.land</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      text-align: center;
      padding: 2.5rem;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      max-width: 420px;
      width: 90%;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
      letter-spacing: -0.05em;
      color: var(--accent);
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Yapım Aşamasında</span>
    <h1>cey.land</h1>
    <p>Burası yeni dijital üs. Projeler, deneysel araçlar ve fikirler çok yakında burada olacak.</p>
  </div>
</body>
</html>
